# Installation autonome : une machine, Docker, rien d'autre.
#
#   docker compose -f docker-compose.standalone.yml up -d
#
# L'interface répond sur http://localhost:8080 (réglable avec AUBI_PORT).
# Pas de Traefik, pas de réseau externe, pas de domaine à posséder.
#
# Le fichier docker-compose.yml, lui, vise une intégration derrière Traefik +
# Authelia (voir docs/installation.md).

name: aubi

services:
  aubi-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: aubi_frontend
    restart: unless-stopped
    # nginx sert l'interface et relaie /api vers le backend : une seule porte
    # d'entrée à ouvrir.
    ports:
      - "${AUBI_PORT:-8080}:80"
    depends_on:
      aubi-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  aubi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: aubi_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aubi:${AUBI_DB_PASSWORD}@aubi-db:5432/aubi
      # Racine explorable depuis l'application, montée à l'identique : le
      # chemin affiché dans l'interface est le vrai chemin de la machine.
      AUBI_MEDIA_ROOT: ${AUBI_MEDIA_ROOT}
      PORT: "3000"
      COVERS_PATH: /app/covers
    volumes:
      - ${AUBI_MEDIA_ROOT}:${AUBI_MEDIA_ROOT}:rw
      - aubi_covers:/app/covers
    depends_on:
      aubi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  aubi-db:
    image: postgres:16-alpine
    container_name: aubi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aubi
      POSTGRES_PASSWORD: ${AUBI_DB_PASSWORD}
      POSTGRES_DB: aubi
    volumes:
      - aubi_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aubi -d aubi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aubi_db:
    name: aubi_db
  aubi_covers:
    name: aubi_covers
