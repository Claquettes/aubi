server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # L'API est servie sur la même origine que l'interface : une installation
    # sans reverse proxy devant (cas standalone) fonctionne telle quelle. En
    # homelab, Traefik intercepte /api avant d'arriver ici — ce bloc ne sert
    # alors jamais.
    location /api/ {
        proxy_pass http://aubi-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming audio : requêtes Range servies au fil de l'eau, sans
        # tampon intermédiaire ni coupure sur les longs fichiers.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
